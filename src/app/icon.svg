<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark navy background -->
  <rect width="32" height="32" rx="6" fill="#1a1a2e"/>
  <!-- Simplified Markhor horn left -->
  <path d="M10,20 C8,14 6,10 8,6 C10,3 13,3 14,6 C15,9 13,13 12,16"
    stroke="#7f85f7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Simplified Markhor horn right -->
  <path d="M16,18 C18,12 20,8 18,5 C16,2 13,3 13,6 C13,9 15,13 15,16"
    stroke="#7f85f7" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="13" cy="20" rx="5" ry="4" fill="#1a1a2e" stroke="#7f85f7" stroke-width="1"/>
  <!-- Eye dot -->
  <circle cx="15" cy="19" r="1" fill="#7f85f7"/>
</svg>
